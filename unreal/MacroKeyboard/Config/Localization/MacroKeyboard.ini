; Localization target of the MacroKeyboard plugin: English source text, Simplified Chinese translation.
; Regenerate with (from the project folder that contains Plugins/MacroKeyboard):
;   UnrealEditor-Cmd.exe <Project>.uproject -run=GatherText -config="Plugins/MacroKeyboard/Config/Localization/MacroKeyboard.ini" -unattended -nullrhi
; Translations live in Content/Localization/MacroKeyboard/zh-Hans/MacroKeyboard.po; the run imports them and writes the .locres.

[CommonSettings]
SourcePath=Plugins/MacroKeyboard/Content/Localization/MacroKeyboard
DestinationPath=Plugins/MacroKeyboard/Content/Localization/MacroKeyboard
ManifestName=MacroKeyboard.manifest
ArchiveName=MacroKeyboard.archive
PortableObjectName=MacroKeyboard.po
ResourceName=MacroKeyboard.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather LOCTEXT / NSLOCTEXT from source
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/MacroKeyboard/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=true

;Gather property names, tooltips and categories of the settings classes
[GatherTextStep1]
CommandletClass=GatherTextFromMetaData
ModulesToPreload=MacroKeyboardRuntime
ModulesToPreload=MacroKeyboardEditor
IncludePathFilters=Plugins/MacroKeyboard/Source/*
FieldTypesToExclude=Function
InputKeys=DisplayName
OutputNamespaces=UObjectDisplayNames
OutputKeys="{FieldPath}"
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
InputKeys=Category
OutputNamespaces=UObjectCategory
OutputKeys="{MetaDataValue}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep2]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

;Export PO files (so new strings show up for translation)
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
