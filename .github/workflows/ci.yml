name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MacroHub.slnx

      - name: Build (warnings as errors)
        run: dotnet build MacroHub.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test MacroHub.slnx -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The end-to-end suite needs an interactive desktop (keyboard hook, SendInput, foreground window),
      # which hosted runners do not provide. Syntax-check it here; run it locally (see docs/development.md).
      - name: Check e2e test and web UI scripts
        run: |
          node --check tests/e2e/e2e.mjs
          node --check src/MacroHub/wwwroot/app.js

      - name: Package (win-x64)
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests -Version "0.0.0-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MacroHub-win-x64
          path: artifacts/*.zip*
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 14
